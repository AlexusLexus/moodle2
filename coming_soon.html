<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница в разработке | СЭО ВятГУ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-toolbar">
        <div class="toolbar-left">
            <!-- <span class="logo-icon">☰</span> -->
            <span class="brand-name">Система электронного образования ВятГУ</span>
        </div>
    </header>

    <main class="coming-soon-wrapper">
        <div class="coming-soon-card">
            
            <div class="illustration-container">
                <svg class="construction-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120">
                    <path d="M10 85 L90 85 L80 75 L20 75 Z" fill="#e2e8f0"/>
                    <path d="M25 75 L75 75 L60 20 L40 20 Z" fill="#f59e0b"/>
                    <path d="M40 20 L60 20 L55 5 L45 5 Z" fill="#ef4444"/>
                    <path d="M31 50 L69 50 L65 35 L35 35 Z" fill="#ffffff"/>
                    <line x1="15" y1="85" x2="85" y2="85" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
                    <line x1="22" y1="75" x2="78" y2="75" stroke="#334155" stroke-width="4"/>
                    <path d="M33 55 L67 55" stroke="#334155" stroke-width="3" stroke-dasharray="5 3"/>
                </svg>
            </div>

            <div class="status-badge">Раздел обновляется</div>
            
            <h1>Страница находится в процессе наполнения</h1>
            
            <p>Преподаватели уже загружают новые лекционные материалы, практические задания и тесты для этого курса. Пожалуйста, загляните сюда чуть позже.</p>
            
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>

            <a href="javascript:history.back()" class="btn btn-blue btn-with-icon">
                <svg width="16" height="16" viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Вернуться назад
            </a>

        </div>
    </main>

</body>
</html>
